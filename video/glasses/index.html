<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kinly on smart glasses (concept)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#fbf3e4; --paper-deep:#f3e6cc; --ink:#3b2f2a; --ink-soft:#6a574c; --line:#dfcfb1;
          --mustard:#e0a526; --apricot:#f2a65a; --rose:#f0a39a; --sky:#a8cde6; --leaf:#b9d08a;
          --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif; --body:"Geist","Helvetica Neue",Arial,sans-serif; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:#1d1512; overflow:hidden; }
  #stage { position:relative; width:1600px; height:900px; overflow:hidden; background:var(--paper); color:var(--ink);
           font:400 18px/1.4 var(--body); -webkit-font-smoothing:antialiased; }
  .scene { position:absolute; inset:0; overflow:hidden; }
  .scene svg { position:absolute; left:0; top:0; width:1600px; height:900px; overflow:visible; transform-origin:800px 450px; will-change:transform; }

  /* glasses HUD */
  #lens { position:absolute; inset:0; pointer-events:none; }
  #vig { position:absolute; inset:0; background:radial-gradient(ellipse 78% 78% at 50% 50%, transparent 62%, rgb(29 21 18 / .28) 86%, rgb(29 21 18 / .6) 100%); }
  #rec { position:absolute; left:96px; top:54px; display:flex; align-items:center; gap:10px; padding:8px 14px 8px 12px; border-radius:999px;
         background:rgb(59 47 42 / .5); color:var(--paper); font:600 18px/1 var(--body); letter-spacing:.04em; font-variant-numeric:tabular-nums; }
  #rec i { width:12px; height:12px; border-radius:50%; background:#e8615a; }
  #concept { position:absolute; right:96px; top:52px; padding:9px 16px; border-radius:999px; background:var(--paper); border:2px solid var(--ink);
             font:600 17px/1 var(--body); color:var(--ink); }
  #ava { position:absolute; left:92px; bottom:62px; width:116px; height:116px; }
  #ava .halo { position:absolute; inset:-6px; border-radius:50%; border:4px solid var(--mustard); opacity:0; }
  #ava .disc { position:absolute; inset:0; border-radius:50%; background:var(--paper); border:3px solid var(--ink); overflow:hidden;
               box-shadow:0 10px 22px -10px rgb(59 47 42 / .7); }
  #ava img { position:absolute; left:50%; top:54%; width:132%; height:132%; transform:translate(-50%,-50%); opacity:0; }
  #kcap { position:absolute; left:226px; bottom:70px; max-width:640px; padding:16px 24px 18px; border-radius:24px 24px 24px 8px; background:var(--paper);
          border:2.5px solid var(--ink); font:600 34px/1.14 var(--display); letter-spacing:-0.03em; box-shadow:0 14px 26px -14px rgb(59 47 42 / .7);
          transform-origin:0 100%; opacity:0; }
  #kcap span, #hcap span { opacity:0; }
  #hcap { position:absolute; left:50%; bottom:40px; transform:translateX(-50%); white-space:nowrap; padding:11px 22px 12px; border-radius:999px;
          background:rgb(59 47 42 / .62); color:var(--paper); font:500 25px/1.15 var(--display); letter-spacing:-0.015em; opacity:0; }
  #chip { position:absolute; right:96px; bottom:84px; display:flex; align-items:center; gap:12px; padding:13px 20px 13px 14px; border-radius:16px;
          background:#fff8ea; border:2.5px solid var(--ink); font:600 21px/1 var(--body); box-shadow:0 14px 26px -14px rgb(59 47 42 / .7); opacity:0; }
  #chip b { font:700 23px/1 var(--display); letter-spacing:-0.02em; }
  #chip small { font-size:18px; color:var(--ink-soft); font-weight:500; }
  #chip .ok { width:34px; height:34px; border-radius:50%; background:var(--leaf); border:2.5px solid var(--ink); display:grid; place-items:center; }
  .lid { position:absolute; left:-5%; width:110%; height:62%; background:#1d1512; }
  #lidT { top:0; border-radius:0 0 50% 50% / 0 0 22% 22%; }
  #lidB { bottom:0; border-radius:50% 50% 0 0 / 22% 22% 0 0; }

  #end { position:absolute; inset:0; background:var(--paper); display:grid; grid-template-columns:auto auto; align-items:center; justify-content:center; gap:56px; opacity:0; }
  #end img { width:330px; height:330px; }
  #end h1 { margin:0 0 26px; font:700 92px/0.98 var(--display); letter-spacing:-0.045em; }
  #end h1 span { display:block; }
  #end .wm { display:inline-flex; align-items:center; gap:14px; font:700 44px/1 var(--display); letter-spacing:-0.03em; }
  #end .wm i { width:56px; height:10px; border-radius:999px; background:var(--mustard); }
</style>
</head>
<body>
<div id="stage">
  <div class="scene" id="s1"></div>
  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>

  <div id="lens">
    <div id="vig"></div>
    <svg width="1600" height="900" style="position:absolute;inset:0">
      <defs><filter id="lb" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter></defs>
      <path filter="url(#lb)" fill="#1d1512" fill-rule="evenodd" opacity=".92"
        d="M-200,-200H1800V1100H-200Z M190,18 H1410 C1530,18 1588,80 1588,200 V700 C1588,820 1530,882 1410,882 H190 C70,882 12,820 12,700 V200 C12,80 70,18 190,18Z"/>
    </svg>
    <div id="rec"><i></i><span id="tc">REC 00:00</span></div>
    <div id="ava"><div class="halo"></div><div class="disc"></div></div>
    <div id="kcap"></div>
    <div id="hcap"></div>
    <div id="chip"><span class="ok"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3.5 9.5l3.6 3.6L14.5 5" fill="none" stroke="#3b2f2a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>Saved</span><small>·</small><b>Mom's scallion pancakes</b><small>· 6 steps</small></div>
  </div>

  <div id="end">
    <img src="../../pet/sticker_love.webp" alt="">
    <div><h1><span id="e1">Today, her phone.</span><span id="e2">Tomorrow, her glasses.</span></h1><div class="wm" id="e3"><i></i>Kinly</div></div>
  </div>

  <div id="concept">Concept · Kinly on smart glasses</div>
  <div class="lid" id="lidT"></div><div class="lid" id="lidB"></div>
</div>

<script>
const INK = "#3b2f2a", PAPER = "#fbf3e4", DEEP = "#f3e6cc", CREAM = "#fff8ea", MUSTARD = "#e0a526", APRICOT = "#f2a65a",
      ROSE = "#f0a39a", SKY = "#a8cde6", LEAF = "#b9d08a", WOOD = "#d9a86c", SKIN = "#f3cfae", NAIL = "#fbe9db", LINE = "#dfcfb1";

/* ---------- timeline (seconds). Clip lengths are the real durations of video/glasses/audio/*.wav ---------- */
const SC = { s1: [0, 12.6], s2: [12.6, 22.3], s3: [22.3, 33.9], end: [33.9, 37.2] };
const TOTAL = 37.2;
const CUES = [
  { id: "s1_her",     who: "her",   at: 0.7,  dur: 5.80, text: "Kinly, I'm making my scallion pancakes. Save the recipe for Anna." },
  { id: "s1_kinly",   who: "kinly", at: 6.8,  dur: 5.19, text: "Recording. Two cups of flour so far. I'll write it down as you go.", mood: "hello" },
  { id: "s2_kinly_a", who: "kinly", at: 14.0, dur: 4.39, text: "That's the evening one. Morning is the white eight-sided tablet.", mood: "worried" },
  { id: "s2_kinly_b", who: "kinly", at: 18.9, dur: 2.77, text: "That's it. Take it with breakfast.", mood: "happy" },
  { id: "s3_kinly_a", who: "kinly", at: 23.0, dur: 3.58, text: "It's ten and the sun is out. Walk with me?", mood: "cozy" },
  { id: "s3_her",     who: "her",   at: 26.9, dur: 1.71, text: "Just to the corner." },
  { id: "s3_kinly_b", who: "kinly", at: 29.0, dur: 4.07, text: "The corner is perfect. Five days in a row.", mood: "yay" },
];
const CHIP_AT = 10.7, RING_A = 13.9, MOVE_B = [16.5, 18.1], RING_B = 18.2, WALK = [29.4, 33.9];
const MOODS = ["hello", "happy", "yay", "worried", "cozy", "love"];
window.TL = { TOTAL, CUES, SC, STILLS: { 1: 11.3, 2: 20.0, 3: 25.2 } };

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const lerp = (a, b, p) => a + (b - a) * p;
const span = (t, a, b) => clamp((t - a) / (b - a));
const $ = (id) => document.getElementById(id);

// Rounded "limbs": every segment is stroked once in ink (wider) and once in fill, so overlapping pieces share one outline.
function limb(segs, fill, ow = 6) {
  return `<g fill="none" stroke-linecap="round" stroke-linejoin="round">` +
    segs.map(([d, w]) => `<path d="${d}" stroke="${INK}" stroke-width="${w + ow * 2}"/>`).join("") +
    segs.map(([d, w]) => `<path d="${d}" stroke="${fill}" stroke-width="${w}"/>`).join("") + `</g>`;
}

// Back of her hand, seen from her own eyes. Local space: wrist at 0,0, fingers toward -y. Default is the right hand (thumb on the left).
function hand({ x, y, rot = 0, curl = 0, flip = 1, under = "", over = "", ring = true }) {
  const len = [104, 118, 108, 82].map((l) => l * (1 - 0.56 * curl));
  const kx = [-47, -16, 16, 46], ky = [-58, -66, -62, -50], fw = [30, 31, 30, 26];
  const tips = kx.map((k, i) => [k * (1 + 0.3 * (1 - curl)), ky[i] - len[i]]);
  const tx = -104 + 34 * curl, ty = -58 + 26 * curl;
  const segs = [["M0,130 L0,40", 92], ["M0,30 L0,-26", 126], [`M-50,22 Q-90,-6 ${tx},${ty}`, 34]];
  kx.forEach((k, i) => segs.push([`M${k},${ky[i]} L${tips[i][0]},${tips[i][1]}`, fw[i]]));
  let det = "";
  kx.forEach((k, i) => {
    det += `<path class="d" stroke-width="3" opacity=".45" d="M${k - 9},${ky[i] + 12} q9,-8 18,0"/>`;
    if (curl < 0.7) det += `<rect x="${tips[i][0] - 8.5}" y="${tips[i][1] - 9}" width="17" height="19" rx="8" fill="${NAIL}" stroke="${INK}" stroke-width="3" opacity=".9"/>`;
  });
  det += `<path class="d" stroke-width="3" opacity=".35" d="M-22,18 q6,-30 2,-58 M12,22 q2,-30 6,-60"/>`;
  if (curl < 0.7) det += `<rect x="${tx - 8}" y="${ty - 12}" width="17" height="18" rx="8" fill="${NAIL}" stroke="${INK}" stroke-width="3" opacity=".9" transform="rotate(-40 ${tx} ${ty})"/>`;
  if (ring) { const a = 0.3, rx = lerp(kx[2], tips[2][0], a), ry = lerp(ky[2], tips[2][1], a);
    det += `<path d="M${rx - 15},${ry} h30" stroke="${INK}" stroke-width="13" stroke-linecap="butt"/><path d="M${rx - 15},${ry} h30" stroke="${MUSTARD}" stroke-width="7" stroke-linecap="butt"/>`; }
  const sleeve = limb([["M0,520 L0,160", 150]], ROSE) + limb([["M-58,150 L58,150", 34]], "#f7c3bc") +
    `<path class="d" stroke-width="3" opacity=".35" d="M-40,210 v260 M0,200 v280 M40,210 v260"/>`;
  return `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(2)}) scale(${flip} 1)">${under}${limb(segs, SKIN)}${det}${sleeve}${over}</g>`;
}
// .o = ink outline, .d = ink detail line, .n = no outline. Applied as default attributes so per-element stroke/width still win.
function fix(root) {
  for (const el of root.querySelectorAll(".o,.d,.n")) {
    const c = el.getAttribute("class"), def = c === "n" ? { stroke: "none" } :
      { stroke: INK, "stroke-width": c === "o" ? 6 : 4, "stroke-linejoin": "round", "stroke-linecap": "round", ...(c === "d" ? { fill: "none" } : {}) };
    for (const k in def) if (!el.hasAttribute(k)) el.setAttribute(k, def[k]);
    el.removeAttribute("class");
  }
}
const shadow = (cx, cy, rx, ry, o = 0.13) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${INK}" opacity="${o}"/>`;
const tree = (x, y, r, c = "#a7c574") => `<path class="o" stroke-width="${Math.max(4, r / 12)}" d="M${x},${y} v${r * 1.5}" fill="none"/><rect x="${x - r * 0.11}" y="${y + r * 0.5}" width="${r * 0.22}" height="${r * 1.4}" fill="#b98a57" class="o" stroke-width="${Math.max(3, r / 16)}"/>
  <circle cx="${x}" cy="${y}" r="${r}" fill="${c}" class="o" stroke-width="${Math.max(4, r / 13)}"/><circle cx="${x - r * 0.3}" cy="${y - r * 0.25}" r="${r * 0.28}" fill="#c3db97" class="n"/>`;
const house = (x, y, w, h, roof) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${CREAM}" class="o" stroke-width="5"/>
  <path d="M${x - 14},${y} L${x + w / 2},${y - h * 0.55} L${x + w + 14},${y}Z" fill="${roof}" class="o" stroke-width="5"/>
  <rect x="${x + w * 0.16}" y="${y + h * 0.25}" width="${w * 0.24}" height="${h * 0.3}" fill="${SKY}" class="o" stroke-width="4"/><rect x="${x + w * 0.58}" y="${y + h * 0.4}" width="${w * 0.22}" height="${h * 0.6}" fill="${APRICOT}" class="o" stroke-width="4"/>`;

/* ---------- scene 1: kitchen ---------- */
function buildS1() {
  let tiles = ""; for (let x = -150; x < 1760; x += 96) tiles += `M${x},292 v118 `;
  const bg = `
    <rect x="-200" y="-200" width="2000" height="700" fill="${DEEP}"/>
    <rect x="-200" y="292" width="2000" height="120" fill="${CREAM}" class="o"/>
    <path d="${tiles} M-200,351 h2000" stroke="${LINE}" stroke-width="3" fill="none"/>
    <!-- window -->
    <rect x="70" y="-70" width="440" height="330" rx="14" fill="#cfe5f2" class="o"/>
    <circle cx="410" cy="62" r="46" fill="#f6d77a" class="n"/>
    <path d="M110,150 q30,-34 62,-8 q34,-30 66,6 q30,0 28,22 h-176 q-14,-12 20,-20z" fill="#fff" opacity=".85" class="n"/>
    <path class="d" stroke-width="6" d="M290,-70 v330 M70,96 h440"/>
    <rect x="46" y="254" width="488" height="26" rx="9" fill="${CREAM}" class="o"/>
    <path d="M132,196 h88 l-12,58 h-64z" fill="${APRICOT}" class="o"/>
    <path d="M176,196 q-50,-30 -40,-84 q44,22 40,84z M176,196 q0,-70 34,-100 q22,56 -34,100z M176,196 q44,-50 86,-34 q-30,44 -86,34z" fill="${LEAF}" class="o" stroke-width="5"/>
    <!-- utensil rail -->
    <path class="d" stroke-width="7" d="M612,118 h296"/>
    <path class="d" stroke-width="6" d="M670,118 v96 M770,118 v84 M860,118 v70"/>
    <circle cx="670" cy="238" r="28" fill="#dfe6e8" class="o"/>
    <rect x="746" y="200" width="48" height="62" rx="9" fill="${WOOD}" class="o"/><path class="d" d="M762,214 v32 M778,214 v32"/>
    <path d="M860,186 q-30,40 0,84 q30,-44 0,-84z M860,186 v84" fill="#dfe6e8" class="o" stroke-width="5"/>
    <!-- shelf -->
    <rect x="1010" y="170" width="560" height="22" rx="7" fill="${WOOD}" class="o"/>
    <path class="d" stroke-width="6" d="M1060,192 v40 l40,-40 M1510,192 v40 l-40,-40"/>
    <rect x="1048" y="84" width="84" height="86" rx="12" fill="${ROSE}" class="o"/><rect x="1040" y="66" width="100" height="24" rx="8" fill="${CREAM}" class="o"/>
    <rect x="1166" y="58" width="92" height="112" rx="12" fill="${LEAF}" class="o"/><rect x="1158" y="40" width="108" height="24" rx="8" fill="${CREAM}" class="o"/>
    <rect x="1292" y="96" width="104" height="74" rx="10" fill="${MUSTARD}" class="o"/><rect x="1310" y="116" width="68" height="30" rx="6" fill="${CREAM}" class="o" stroke-width="4"/>
    <path d="M1424,128 h112 q0,42 -56,42 q-56,0 -56,-42z" fill="${SKY}" class="o"/><path d="M1432,108 h96 q0,22 -48,22 q-48,0 -48,-22z" fill="${CREAM}" class="o"/>`;
  const mid = `
    <rect x="-200" y="410" width="2000" height="800" fill="#efd2a4" class="o"/>
    <path d="M-200,470 h2000 M-200,640 h520 M1180,760 h620 M-200,820 h380" stroke="#e2bd87" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- flour bag -->
    ${shadow(290, 486, 120, 18)}
    <path d="M196,270 h176 l12,206 q0,12 -12,12 h-176 q-12,0 -12,-12z" fill="${CREAM}" class="o"/>
    <path d="M196,270 l22,-34 h132 l22,34z" fill="${DEEP}" class="o"/>
    <rect x="190" y="338" width="188" height="76" fill="${MUSTARD}" class="o"/>
    <text x="284" y="392" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="700" font-size="40" letter-spacing="-1" fill="${INK}">FLOUR</text>
    <g transform="translate(0 -58)"><!-- rolling pin -->
    ${shadow(690, 528, 220, 12)}
    <rect x="462" y="488" width="70" height="22" rx="11" fill="#c9925a" class="o"/><rect x="848" y="488" width="70" height="22" rx="11" fill="#c9925a" class="o"/>
    <rect x="520" y="474" width="340" height="50" rx="25" fill="${WOOD}" class="o"/>
    <!-- measuring cups -->
    ${shadow(1000, 512, 80, 12)}
    <path d="M950,440 h92 l-8,66 q-2,8 -10,8 h-56 q-8,0 -10,-8z" fill="${CREAM}" class="o"/><path class="d" stroke-width="6" d="M950,452 h-44"/>
    <ellipse cx="996" cy="441" rx="46" ry="10" fill="#fff" class="o" stroke-width="5"/>
    </g><!-- bowl of dough -->
    ${shadow(1310, 706, 210, 26)}
    <ellipse cx="1310" cy="520" rx="214" ry="62" fill="#7fb0cf" class="o"/>
    <path d="M1150,528 C1160,410 1300,392 1352,416 C1440,412 1478,470 1470,528 C1400,566 1220,566 1150,528z" fill="#fbeecf" class="o"/>
    <path class="d" stroke-width="4" opacity=".45" d="M1230,470 q40,-34 92,-22 M1380,462 q30,16 36,44"/>
    <path d="M1096,520 A214,62 0 0 0 1524,520 C1524,650 1420,712 1310,712 C1200,712 1096,650 1096,520z" fill="${SKY}" class="o"/>
    <path d="M1108,580 C1180,640 1440,640 1512,580" class="d" stroke="${CREAM}" stroke-width="12"/>
    <g fill="#fff" opacity=".8" class="n"><ellipse cx="1060" cy="640" rx="46" ry="12"/><ellipse cx="1130" cy="760" rx="60" ry="14"/><ellipse cx="930" cy="560" rx="30" ry="8"/><circle cx="1010" cy="690" r="6"/><circle cx="1200" cy="800" r="7"/></g>`;
  const near = `<g transform="translate(30 -112)">
    <path d="M330,601 L1010,601 Q1040,601 1046,628 L1100,856 Q1106,886 1076,886 L270,886 Q240,886 246,856 L296,628 Q302,601 330,601z" fill="#b98350" class="o"/>
    <path d="M330,585 L1010,585 Q1040,585 1046,612 L1100,840 Q1106,870 1076,870 L270,870 Q240,870 246,840 L296,612 Q302,585 330,585z" fill="${WOOD}" class="o"/>
    <path d="M360,640 h560 M330,730 h300 M700,820 h340" stroke="#cb9858" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g id="s1stalks"></g><g id="s1rings"></g><g id="s1hands"></g></g>`;
  $("s1").innerHTML = `<svg id="s1bg" viewBox="0 0 1600 900">${bg}</svg><svg id="s1mid" viewBox="0 0 1600 900">${mid}</svg><svg id="s1near" viewBox="0 0 1600 900">${near}</svg>`;
}
const RINGS = Array.from({ length: 26 }, (_, i) => { const a = i * 2.399, r = 14 + 9.5 * Math.sqrt(i); return [928 + Math.cos(a) * r * 1.5, 640 + Math.sin(a) * r * 0.82, i % 3]; });
function drawS1(t) {
  const ph = (t * 1.9) % 1, lift = Math.pow(Math.max(0, Math.sin(ph * Math.PI)), 0.8);       // chop rhythm
  const n = Math.floor(clamp(t * 1.9, 0, 26)), feed = Math.min(60, t * 5);
  // scallions: cut ends at the knife, uncut stalks slide in under the left hand
  const sx = 838, sy = 668;
  $("s1stalks").innerHTML =
    limb([[`M${380 + feed},${806 - feed * 0.3} L${sx},${sy}`, 20], [`M${390 + feed},${832 - feed * 0.3} L${sx + 8},${sy + 22}`, 20], [`M${372 + feed},${782 - feed * 0.3} L${sx - 10},${sy - 22}`, 18]], "#a6cd74", 5) +
    `<path d="M${560 + feed},${752 - feed * 0.3} L${sx - 4},${sy}" stroke="#c9e3a0" stroke-width="5" stroke-linecap="round" fill="none"/>`;
  $("s1rings").innerHTML = RINGS.slice(0, n).map(([x, y, k]) =>
    `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="12" fill="${k ? "#a6cd74" : "#c9e3a0"}" stroke="${INK}" stroke-width="4.5"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="#eef5d6"/>`).join("");
  const knife = `<path d="M-14,-150 L-14,-418 C22,-384 50,-300 50,-150 Z" fill="#e9eef0" class="o"/><path d="M-2,-170 L-2,-372" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8"/>` +
    limb([["M8,-36 L8,-150", 32]], "#6a574c") + `<circle cx="8" cy="-134" r="4" fill="${DEEP}"/><circle cx="8" cy="-108" r="4" fill="${DEEP}"/>`;
  $("s1hands").innerHTML =
    hand({ x: 452 + feed * 0.5, y: 812 - feed * 0.15, rot: 52, curl: 0.42, flip: -1, ring: false }) +
    hand({ x: 1130, y: 806 - lift * 26, rot: -62 + lift * 5, curl: 0.78, under: knife });
}

/* ---------- scene 2: table by the window ---------- */

  $("rec").querySelector("i").style.opacity = (t % 1.2) < 0.7 ? 1 : 0.25;
  // active cues (captions hold briefly after the clip ends)
  let k = null, h = null, mood = "hello";
  for (const c of CUES) {
    if (c.who === "kinly" && t >= c.at - 0.6) mood = c.mood;
    if (t >= c.at - 0.05 && t < c.at + c.dur + 0.55) { if (c.who === "kinly") k = c; else h = c; }
  }
  if (t >= CHIP_AT && t < SC.s1[1]) mood = "yay";
  for (const m of MOODS) $("st_" + m).style.opacity = m === mood ? 1 : 0;
  const speaking = k && t < k.at + k.dur;
  const pulse = speaking ? 1 + 0.045 * Math.sin((t - k.at) * 9) : 1;
  $("ava").style.transform = `scale(${pulse.toFixed(4)})`;
  const hp = speaking ? ((t - k.at) * 1.1) % 1 : 0;
  const halo = $("ava").querySelector(".halo"); halo.style.opacity = speaking ? (0.9 * (1 - hp)).toFixed(3) : 0; halo.style.transform = `scale(${(1 + 0.16 * hp).toFixed(3)})`;
  const reveal = (el, c) => {
    const ws = el.children, n = ws.length, p = (t - c.at) / (c.dur * 0.86);
    for (let i = 0; i < n; i++) ws[i].style.opacity = clamp((p * n - i) * 2.5 + 1).toFixed(2);
    const a = out(span(t, c.at - 0.05, c.at + 0.25)) * (1 - ease(span(t, c.at + c.dur + 0.3, c.at + c.dur + 0.55)));

  else { kc.style.opacity = 0; lastK = null; }

  if (which === "s1") {
    drawS1(t);
    $("s1bg").style.transform = bob(t, 0.6, 1.03); $("s1mid").style.transform = bob(t, 1.3, 1.03); $("s1near").style.transform = bob(t, 2.1, 1.03);
  } else if (which === "s2") {
    drawS2(t); const push = 1.03 + 0.02 * ease(span(t, SC.s2[0], SC.s2[1]));
    $("s2bg").style.transform = bob(t, 0.6, 1.03); $("s2mid").style.transform = bob(t, 1.3, push); $("s2near").style.transform = bob(t, 2.2, push);
  } else if (which === "s3") {
    drawS3(t);
    const p = ease(span(t, WALK[0], WALK[1])), step = p > 0 && p < 1 ? Math.sin((t - WALK[0]) * 6.2) * 7 * Math.sin(p * Math.PI) : 0;
    const walk = `translateY(${step.toFixed(2)}px) `;
    $("s3far").style.transformOrigin = "800px 470px"; $("s3room").style.transformOrigin = "800px 500px";
    $("s3far").style.transform = walk + bob(t, 0.4, 1.03 + 0.42 * p);
    $("s3room").style.transform = walk + bob(t, 1.2, 1.03 + 2.7 * p * p + 0.5 * p);
    $("s3near").style.transform = bob(t, 2.2, 1.03);
  }
  const e = $("end"); e.style.opacity = which === "end" ? 1 : 0;
  if (which === "end") {
    const u = t - SC.end[0];
    [["e1", 0.25], ["e2", 0.6], ["e3", 1.0]].forEach(([id, d]) => { const a = out(span(u, d, d + 0.55)); $(id).style.opacity = a.toFixed(3); $(id).style.transform = `translateY(${((1 - a) * 26).toFixed(1)}px)`; });
    const a = out(span(u, 0.1, 0.7)); e.querySelector("img").style.transform = `scale(${(0.86 + 0.14 * a).toFixed(3)}) rotate(${(-4 + 4 * a + 1.5 * Math.sin(u * 2.4)).toFixed(2)}deg)`;
  }
  if (which !== "end") fix($(which));
  drawHud(t);
}
window.renderAt = renderAt;

buildS1(); buildS2(); buildS3(); buildHud(); fix($("stage"));
const q = new URLSearchParams(location.search);
if (q.has("t")) renderAt(parseFloat(q.get("t")));
else if (q.has("capture")) renderAt(0);
else { const t0 = performance.now(); const loop = () => { const t = ((performance.now() - t0) / 1000) % (TOTAL + 1); renderAt(t); requestAnimationFrame(loop); }; loop(); }
</script>
</body>
